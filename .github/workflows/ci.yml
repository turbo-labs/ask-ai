name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is committed so `npm install github:turbo-labs/ask-ai` needs no build step.
      - name: dist is up to date
        run: git diff --exit-code -- dist src/icons.ts
